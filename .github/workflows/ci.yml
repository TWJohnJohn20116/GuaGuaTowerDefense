# 瓜瓜塔防 · CI（建置與測試）
#
# 六道閘門：型別 → 語言鍵對齊 → 技術債棘輪 → 單元測試 → 產線建置 → 打包體積預算。
# 這道閘門的由來：本專案早期只有 tag 觸發的 release workflow，沒型別檢查也沒測試，
# 於是 tsc 累積到 89 個錯誤、10 個測試長期紅著，`generateId 未定義` 這種會打死幀迴圈
# 的 bug 也能一路進到發佈版。
#
# 速度設計（2026-11-14 改版，實測 wall clock 1m31s → 1m02s → 見下方分片說明）：
#   - 拆成平行 job：靜態檢查與建置（static）／單元測試分片（test ×3）／結果總結（summary）。
#     單一 job 序列跑時，44s 的測試完全擋住 14s 的型別檢查與 8s 的建置。
#   - 單元測試用 vitest --shard 切成 3 片，三個 runner 平行跑（每片固定開銷約 13s）。
#   - setup-node 開 cache: npm，install 只要 5s（未快取時約 25s）。
#   - concurrency cancel-in-progress：連續 push 只留最新一次，舊的立刻取消。
#
# 觸發規則（見 AGENTS.md §13.1）：
#   - push 可加 paths-ignore（純文件／截圖不燒 CI 分鐘）
#   - pull_request 刻意不加 paths / paths-ignore：某個 PR 因路徑被過濾而不觸發時，
#     必要檢查會永遠停在 waiting，那個 PR 根本無法合併
#
# runner 固定 ubuntu-24.04，不用 ubuntu-latest（latest 會在某天默默換 Ubuntu 26）。

name: 建置與測試

run-name: 建置與測試 · ${{ github.event.head_commit.message || github.ref_name }}

on:
  push:
    branches: ['**']
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.shots/**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Node 24 = npm 11，與 package-lock.json 的產生環境一致。
  # 用 Node 20（npm 10）會對 vitest@4 的嵌套 vite 解析出不同樹，
  # 導致 npm ci 判定 lock 不完整（Missing: esbuild@0.28.2）。
  NODE_VERSION: '24'
  # 測試分片數：實測 2 片時每片仍要 ~48s（固定開銷約 13s + 測試 ~35s），
  # 3 片把測試壓到 ~25s，讓「靜態檢查與建置」（39s）成為關鍵路徑。
  TEST_SHARDS: 3

jobs:
  # ─────────────────────────────────────────────
  # 靜態檢查與建置：型別、語言鍵、技術債棘輪、產線建置、打包體積預算
  # ─────────────────────────────────────────────
  static:
    name: 靜態檢查與建置
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: 取得原始碼
        uses: actions/checkout@v4

      - name: 設定 Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: 安裝依賴
        run: npm ci

      - name: 型別檢查（tsc --noEmit）
        run: npm run typecheck

      - name: 語言鍵對齊（10 個語言檔，嚴格模式）
        run: npm run i18n:check

      - name: "技術債棘輪（as any／: any／eslint-disable 只准降）"
        run: node scripts/ci/guards.mjs --debt

      - name: 產線建置
        run: npm run build

      - name: 打包體積預算（主 chunk 上限 1.18 MB）
        run: node scripts/ci/guards.mjs --bundle

  # ─────────────────────────────────────────────
  # 單元測試：vitest 分片平行跑，兩片都成功才算過
  # ─────────────────────────────────────────────
  test:
    name: 單元測試（第 ${{ matrix.shard }} 片 / 共 3 片）
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      # 一片紅了其他片也跑完，方便一次看到所有失敗
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      - name: 取得原始碼
        uses: actions/checkout@v4

      - name: 設定 Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: 安裝依賴
        run: npm ci

      - name: 單元測試（vitest --shard=${{ matrix.shard }}/${{ env.TEST_SHARDS }}）
        run: npm run test -- --shard=${{ matrix.shard }}/${{ env.TEST_SHARDS }}

  # ─────────────────────────────────────────────
  # 結果總結：中文摘要表寫進 run 首頁，並把「任一關卡失敗」變成這一個 job 的紅燈
  # （要設成分支保護的必要檢查時，指定這一個即可）
  # ─────────────────────────────────────────────
  summary:
    name: 結果總結
    runs-on: ubuntu-24.04
    needs: [static, test]
    # 一定要 always()：needs 失敗時若 job 被略過，依賴它的檢查會永遠停在 waiting
    if: always()
    timeout-minutes: 5

    steps:
      - name: 彙總各關卡結果
        env:
          STATIC_RESULT: ${{ needs.static.result }}
          TEST_RESULT: ${{ needs.test.result }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          chinese_result() {
            case "$1" in
              success) echo "✅ 通過" ;;
              failure) echo "❌ 失敗" ;;
              cancelled) echo "⏹️ 已取消" ;;
              skipped) echo "⏭️ 已略過" ;;
              *) echo "⚠️ $1" ;;
            esac
          }

          {
            echo "## 瓜瓜塔防 · CI 結果"
            echo ""
            echo "| 關卡 | 內容 | 結果 |"
            echo "|---|---|---|"
            echo "| 靜態檢查與建置 | 型別、語言鍵、技術債棘輪、產線建置、體積預算 | $(chinese_result "$STATIC_RESULT") |"
            echo "| 單元測試 | 159 個測試檔分 ${TEST_SHARDS:-2} 片平行跑 | $(chinese_result "$TEST_RESULT") |"
            echo ""
            echo "- 分支：\`${GITHUB_REF_NAME}\`"
            echo "- commit：\`${GITHUB_SHA:0:7}\`"
            # 注意：不要寫成 [ -n "$X" ] && echo ...，GitHub 的 bash 有 -e，
            # 條件不成立時整步會直接失敗。
            if [ -n "$COMMIT_MSG" ]; then
              echo "- 訊息：${COMMIT_MSG%%$'\n'*}"
            fi
            echo "- 觸發：\`${GITHUB_EVENT_NAME}\`"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$STATIC_RESULT" != "success" ] || [ "$TEST_RESULT" != "success" ]; then
            echo "::error::有閘門未通過（靜態檢查=$STATIC_RESULT，單元測試=$TEST_RESULT）"
            exit 1
          fi
          echo "全部閘門通過 ✅"
