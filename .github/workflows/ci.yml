# CI：型別 + i18n 對齊 + 技術債棘輪 + 單元測試 + 產線建置 + bundle 預算
#
# 這個專案先前只有 tag 觸發的 release workflow：沒有型別檢查、沒有測試，
# 於是 tsc 累積到 89 個錯誤、10 個測試長期紅著，而 generateId 未定義這種
# 會在遊戲中直接打死幀迴圈的 bug 也能一路進到發佈版。這裡補上那道閘門。
#
# 2026-11-14 加強：
#   - workflow_dispatch：可手動重跑
#   - paths-ignore（僅 push）：純文件／截圖變更不浪費 CI 分鐘；PR 刻意不加，理由見 on: 的註解
#   - 技術債棘輪（scripts/ci/guards.mjs）：as any / : any / eslint-disable 等只准降不准升
#   - bundle 預算：主 chunk 超過 1.4 MB 直接紅燈（目前 1.33 MB，見 架構圖.html §21）
#   - 失敗時上傳測試相關日誌，方便排查（不上傳 node_modules）

name: CI

on:
  push:
    branches: ['**']
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.shots/**'
  # 注意：pull_request 刻意不加 paths / paths-ignore。
  # 一旦某個 PR 因為路徑過濾而沒觸發，未來設定的必要檢查就會永遠停在 waiting，
  # 那個 PR 根本無法合併——寧可多跑一次，也不要讓閘門消失。
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    # 固定版本，不用 ubuntu-latest：latest 會在某天默默換成新 Ubuntu，
    # 讓 Node／原生依賴的行為在同一個 commit 上改變。要升級就改這裡並用 CI 驗一次。
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Node 24 = npm 11，與 package-lock.json 的產生環境一致。
          # 用 Node 20（npm 10）會對 vitest@4 的嵌套 vite 解析出不同樹，
          # 導致 npm ci 判定 lock 不完整（Missing: esbuild@0.28.2）。
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 先跑最快的閘門：型別與技術債計數，壞了就不必浪費時間跑測試
      - name: Type check
        run: npm run typecheck

      - name: i18n parity (strict)
        run: npm run i18n:check

      - name: Debt ratchet
        run: node scripts/ci/guards.mjs --debt

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build

      - name: Bundle budget
        run: node scripts/ci/guards.mjs --bundle
