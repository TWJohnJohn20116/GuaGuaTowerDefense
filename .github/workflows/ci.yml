# 瓜瓜塔防 · CI（建置與測試）
#
# 六道閘門：型別 → 語言鍵對齊 → 技術債棘輪 → 產線建置 → 打包體積預算 → 單元測試。
# 這道閘門的由來：本專案早期只有 tag 觸發的 release workflow，沒型別檢查也沒測試，
# 於是 tsc 累積到 89 個錯誤、10 個測試長期紅著，`generateId 未定義` 這種會打死幀迴圈
# 的 bug 也能一路進到發佈版。
#
# ── 速度設計（2026-11-14 第三版，目標 wall clock < 30s）────────────────────
#
# 這條 CI 的時間幾乎都花在「每個 job 的固定成本」，不是花在工作本身：
#
#   job 啟動 1–3s ＋ checkout 1–5s ＋ setup-node 1–7s ＋ npm ci 3–5s ＝ 6–20s
#
# 而真正的工作量（實測）：
#
#   型別檢查 20s 冷跑／2s 命中增量快取      ← skipLibCheck 已開，20s 是真的在讀 952 檔
#   產線建置 8–11s
#   單元測試 單進程 44s；切 6 片後每片 7–10s；切 8 片後 6–9s
#   結果總結 1s 腳本＋等 needs 的 3–4s 排隊
#
# 三個關鍵實驗（都留下數據）：
#
#   3 片＋單一 static job  → wall 51s（static 序列跑型別 20s＋建置 11s＝關鍵路徑）
#   8 片（11 個 job）      → wall 41s（工作只剩 2s／6–9s，但 runner 擠爆：
#                                   有一片 Set up job 3s＋checkout 5s＋setup-node 8s）
#   6 片（9 個 job）       → wall 40s（建置 job 固定成本 20s＋建置 8s＝31s 關鍵路徑，
#                                   再加上 summary 在尾端多等 6s）
#
# 結論：job 開得越多，每個 VM 的冷啟動越慢，所以「再拆」是負優化。這一版反過來收斂：
#
#   1. 型別與建置合併成一個 static job（固定成本只付一次；型別命中快取時只 2s）
#   2. 單元測試切 6 片（每片 7–10s 工作量，比 static 的 12s 還短）
#   3. tsc 開 --incremental ＋快取 .tsbuildinfo（key 含 tsconfig 與 lock 的 hash）
#   4. npm ci 加 --no-audit --no-fund --prefer-offline
#   5. summary 只在有 job 失敗時才跑（成功時它要排在所有 job 之後，白等 6–9s）
#
# 刻意不做（量過或算過不划算）：
#   - 快取 node_modules：還原 tar 比 npm ci 的 3–5s 更慢
#   - 再切更多測試片：固定成本 6–20s 不變，只會讓更多 VM 一起冷啟動
#   - 把 tsc 與 vite build 在同一 job 內用背景並行：省不到 3s，卻失去「哪一步紅」的歸屬
#
# 觸發規則（見 AGENTS.md §13.1）：
#   - push 可加 paths-ignore（純文件／截圖不燒 CI 分鐘）
#   - pull_request 刻意不加 paths / paths-ignore：某個 PR 因路徑被過濾而不觸發時，
#     必要檢查會永遠停在 waiting，那個 PR 根本無法合併
#
# runner 固定 ubuntu-24.04，不用 ubuntu-latest（latest 會在某天默默換 Ubuntu 26）。

name: 建置與測試

# 標題必須單行：用 head_commit.message 會把整段多行訊息塞進標題，run 清單會變得很難看。
# 觸發方式用繁中標籤；PR 顯示編號（否則 ref_name 會是沒有意義的 "3/merge"）。
run-name: 建置與測試 · ${{ github.event_name == 'push' && '推送' || github.event_name == 'pull_request' && '合併請求' || '手動觸發' }} · ${{ github.event.pull_request.number && format('#{0}', github.event.pull_request.number) || github.ref_name }}

on:
  push:
    # '!dependabot/**' 一定要放在 '**' 後面：Dependabot 開 PR 時會先 push 分支，
    # 沒排除的話同一個 commit 會跑兩次（push + pull_request），白燒一倍 CI 分鐘。
    branches:
      - '**'
      - '!dependabot/**'
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.shots/**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Node 24 = npm 11，與 package-lock.json 的產生環境一致。
  # 用 Node 20（npm 10）會對 vitest@4 的嵌套 vite 解析出不同樹，
  # 導致 npm ci 判定 lock 不完整（Missing: esbuild@0.28.2）。
  NODE_VERSION: '24'
  # 測試分片數。vitest 以「檔案」為單位切，所以每片很不平均（實測 5 片時 9–16s）。
  # 片數少→最慢的那片拖住關鍵路徑；片數多→更多 VM 一起冷啟動（固定成本 6–18s）。
  # 實測每片工作量：5 片 9–16s、6 片 7–10s。多開一個 VM 換掉 6s 的關鍵路徑值得。
  TEST_SHARDS: 6

jobs:
  # ─────────────────────────────────────────────
  # 靜態檢查與建置：型別、語言鍵、技術債棘輪、產線建置、打包體積預算
  # 合併成一個 job 的理由：拆成兩個要多付一份 6–20s 的固定成本，
  # 而型別命中增量快取後只剩 2s，根本不值得再開一個 VM。
  # ─────────────────────────────────────────────
  static:
    name: 靜態檢查與建置
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: 取得原始碼
        uses: actions/checkout@v7

      - name: 設定 Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: 安裝依賴
        run: npm ci --no-audit --no-fund --prefer-offline

      # tsc 的 --incremental 只重驗有改動的檔案；沒有這份快取就要每次冷跑 20s。
      # key 含 tsconfig 與 lock 的 hash：編譯選項或型別套件版本一變就自動失效。
      # restore-keys 用前綴，允許跨分支取最近一份（tsc 以檔案內容 hash 驗證，
      # 內容不符就重新檢查，不會把別人的結論當自己的）。
      - name: 還原型別檢查快取
        uses: actions/cache@v4
        with:
          path: .cache/tsc
          key: tsc-${{ hashFiles('tsconfig.json', 'tsconfig.node.json', 'package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            tsc-${{ hashFiles('tsconfig.json', 'tsconfig.node.json', 'package-lock.json') }}-

      - name: 型別檢查（tsc --noEmit，增量快取）
        run: |
          mkdir -p .cache/tsc
          ./node_modules/.bin/tsc --noEmit --incremental --tsBuildInfoFile .cache/tsc/main.tsbuildinfo

      - name: 語言鍵對齊（10 個語言檔，嚴格模式）
        run: npm run i18n:check

      - name: "技術債棘輪（as any／: any／eslint-disable 只准降）"
        run: node scripts/ci/guards.mjs --debt

      - name: 產線建置
        # TAURI_PLATFORM=windows → build.target 用 chrome105，也就是 release.yml
        # 實際出貨的那一份。不設的話 CI 會用 safari13 目標，多做一層降級轉譯，
        # 量到的還是個不出貨的產物（體積也偏大）。
        env:
          TAURI_PLATFORM: windows
        run: npm run build

      - name: 打包體積預算（主 chunk 上限 1.18 MB）
        run: node scripts/ci/guards.mjs --bundle

  # ─────────────────────────────────────────────
  # 單元測試：vitest 分片平行跑，任一片紅就算紅
  # ─────────────────────────────────────────────
  test:
    name: 單元測試（第 ${{ matrix.shard }} 片 / 共 6 片）
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      # 一片紅了其他片也跑完，方便一次看到所有失敗
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]

    steps:
      - name: 取得原始碼
        uses: actions/checkout@v7

      - name: 設定 Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: 安裝依賴
        run: npm ci --no-audit --no-fund --prefer-offline

      - name: 單元測試（vitest --shard=${{ matrix.shard }}/${{ env.TEST_SHARDS }}）
        run: npm run test -- --shard=${{ matrix.shard }}/${{ env.TEST_SHARDS }}

  # ─────────────────────────────────────────────
  # 結果總結：只在有 job 失敗時才跑
  #
  # 它必須排在所有 job 之後，成功時要多等 6–9s（needs 結算 + runner 排隊 + 腳本），
  # 而成功時的資訊價值接近零（GitHub 自己就會顯示每個 job 的綠勾）。
  # 失敗時那張中文表才真的有用，所以條件改成 failure()。
  #
  # 注意：這個 job 在成功時是 skipped。若要把它設成分支保護的必要檢查，
  # 必須改回 `if: always()`，否則「skipped」不會被視為通過。
  # ─────────────────────────────────────────────
  summary:
    name: 結果總結（僅失敗時）
    runs-on: ubuntu-24.04
    needs: [static, test]
    if: failure()
    timeout-minutes: 5

    steps:
      - name: 彙總各關卡結果
        env:
          STATIC_RESULT: ${{ needs.static.result }}
          TEST_RESULT: ${{ needs.test.result }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          chinese_result() {
            case "$1" in
              success) echo "✅ 通過" ;;
              failure) echo "❌ 失敗" ;;
              cancelled) echo "⏹️ 已取消" ;;
              skipped) echo "⏭️ 已略過" ;;
              *) echo "⚠️ $1" ;;
            esac
          }

          {
            echo "## 瓜瓜塔防 · CI 結果"
            echo ""
            echo "| 關卡 | 內容 | 結果 |"
            echo "|---|---|---|"
            echo "| 靜態檢查與建置 | 型別、語言鍵、技術債棘輪、產線建置、體積預算 | $(chinese_result "$STATIC_RESULT") |"
            echo "| 單元測試 | 159 個測試檔分 ${TEST_SHARDS} 片平行跑 | $(chinese_result "$TEST_RESULT") |"
            echo ""
            echo "- 分支：\\`${GITHUB_REF_NAME}\\`"
            echo "- commit：\\`${GITHUB_SHA:0:7}\\`"
            # 注意：不要寫成 [ -n "$X" ] && echo ...，GitHub 的 bash 有 -e，
            # 條件不成立時整步會直接失敗。
            if [ -n "$COMMIT_MSG" ]; then
              echo "- 訊息：${COMMIT_MSG%%$'\\n'*}"
            fi
            echo "- 觸發：\\`${GITHUB_EVENT_NAME}\\`"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$STATIC_RESULT" != "success" ] || [ "$TEST_RESULT" != "success" ]; then
            echo "::error::有閘門未通過（靜態檢查=$STATIC_RESULT，單元測試=$TEST_RESULT）"
            exit 1
          fi
          echo "全部閘門通過 ✅"
